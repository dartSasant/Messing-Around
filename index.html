<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=DM+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --rose: #c8445a;
        --rose-light: #f2a8b4;
        --rose-pale: #fdf0f2;
        --cream: #faf7f0;
        --paper: #f5f0e8;
        --ink: #1a1018;
        --ink-faded: #4a3f48;
        --muted: #7a6070;
        --gold: #c9a84c;
        --line: rgba(0, 0, 0, 0.07);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        font-weight: 300;
        overflow-x: hidden;
        cursor: none;
      }

      .cursor {
        position: fixed;
        width: 10px;
        height: 10px;
        background: var(--rose);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
      }
      .cursor-ring {
        position: fixed;
        width: 32px;
        height: 32px;
        border: 1px solid var(--rose-light);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
      }

      #particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      section {
        position: relative;
        z-index: 1;
      }

      /* ---- HERO ---- */
      #hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4rem 2rem;
        gap: 1.5rem;
      }

      .hero-eyebrow {
        font-size: 0.65rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--rose);
        opacity: 0;
      }

      .hero-name {
        font-family: "Playfair Display", serif;
        font-size: clamp(4rem, 12vw, 9rem);
        font-weight: 400;
        line-height: 0.9;
        color: var(--ink);
        opacity: 0;
      }

      .hero-name em {
        font-style: italic;
        color: var(--rose);
      }

      .hero-sub {
        font-size: 0.95rem;
        color: var(--muted);
        letter-spacing: 0.05em;
        max-width: 340px;
        line-height: 1.9;
        opacity: 0;
      }

      .hero-heart {
        font-size: 1.8rem;
        opacity: 0;
        display: inline-block;
        animation: heartbeat 1.4s ease-in-out infinite;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.25);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.15);
        }
        70% {
          transform: scale(1);
        }
      }

      .scroll-hint {
        position: absolute;
        bottom: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .scroll-line {
        width: 1px;
        height: 40px;
        background: linear-gradient(to bottom, var(--rose), transparent);
        animation: scrollPulse 2s ease-in-out infinite;
      }
      @keyframes scrollPulse {
        0%,
        100% {
          transform: scaleY(1);
          opacity: 1;
        }
        50% {
          transform: scaleY(0.4);
          opacity: 0.3;
        }
      }

      /* ---- COUNTER ---- */
      #counter-section {
        background: var(--ink);
        color: white;
        padding: 6rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
        text-align: center;
      }

      .section-label {
        font-size: 0.62rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--rose-light);
      }

      .counter-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.07);
        max-width: 680px;
        width: 100%;
      }

      .counter-item {
        padding: 3rem 1.5rem;
        background: var(--ink);
        text-align: center;
      }

      .counter-num {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.5rem, 6vw, 5rem);
        font-weight: 400;
        color: white;
        display: block;
        line-height: 1;
      }

      .counter-label {
        font-size: 0.6rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        margin-top: 0.75rem;
        display: block;
      }

      .counter-since {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 1rem;
        color: var(--rose-light);
      }

      /* ---- LETTER ---- */
      #letter-section {
        padding: 8rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        background: var(--cream);
      }

      .letter-header {
        text-align: center;
      }

      .letter-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 4vw, 3rem);
        font-weight: 400;
      }
      .letter-title em {
        font-style: italic;
        color: var(--rose);
      }

      .letter-wrap {
        max-width: 680px;
        width: 100%;
        position: relative;
      }

      /* paper effect */
      .letter-paper {
        background: var(--paper);
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 2px;
        padding: 4rem 4rem 5rem;
        position: relative;
        box-shadow:
          0 4px 40px rgba(0, 0, 0, 0.06),
          0 1px 4px rgba(0, 0, 0, 0.04);
      }

      /* ruled lines */
      .letter-paper::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 2px;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2.2rem,
          rgba(0, 0, 0, 0.045) 2.2rem,
          rgba(0, 0, 0, 0.045) calc(2.2rem + 1px)
        );
        background-position: 0 4.6rem;
        pointer-events: none;
      }

      /* red margin line */
      .letter-paper::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 5rem;
        width: 1px;
        background: rgba(200, 68, 90, 0.2);
        pointer-events: none;
      }

      .letter-date {
        font-family: "Special Elite", cursive;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: right;
        margin-bottom: 2rem;
        opacity: 0;
      }

      .letter-salutation {
        font-family: "Special Elite", cursive;
        font-size: 1.1rem;
        color: var(--ink);
        margin-bottom: 1.5rem;
        opacity: 0;
      }

      .letter-body {
        font-family: "Special Elite", cursive;
        font-size: 1rem;
        line-height: 2.2rem;
        color: var(--ink-faded);
        min-height: 22rem;
        position: relative;
      }

      #typed-text {
        display: inline;
      }

      .type-cursor {
        display: inline-block;
        width: 2px;
        height: 1.1em;
        background: var(--rose);
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blink 0.75s step-end infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .letter-sign {
        font-family: "Special Elite", cursive;
        font-size: 1rem;
        color: var(--ink);
        text-align: right;
        margin-top: 2rem;
        line-height: 1.8;
        opacity: 0;
      }

      .letter-stamp {
        position: absolute;
        bottom: 2.5rem;
        right: 3rem;
        width: 56px;
        height: 68px;
        border: 2px solid var(--rose-light);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        color: var(--rose);
        opacity: 0.4;
        transform: rotate(6deg);
      }

      /* ---- FINALE ---- */
      #finale {
        background: var(--ink);
        padding: 8rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 2rem;
        min-height: 55vh;
      }

      .finale-text {
        font-family: "Playfair Display", serif;
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 400;
        color: white;
        line-height: 1.2;
        max-width: 560px;
        opacity: 0;
      }
      .finale-text em {
        font-style: italic;
        color: var(--rose-light);
      }

      .finale-from {
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.25);
        opacity: 0;
      }

      @media (max-width: 600px) {
        .counter-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .letter-paper {
          padding: 2.5rem 1.75rem 3.5rem;
        }
        .letter-paper::after {
          left: 3rem;
        }
        .letter-stamp {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="particles"></canvas>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- HERO -->
    <section id="hero">
      <p class="hero-eyebrow">a letter for</p>
      <h1 class="hero-name">My<br /><em>Love</em></h1>
      <p class="hero-sub">
        You keep asking "Why you love me?"<br />Dont You?<br />.Heres the
        answer.
      </p>
      <div class="hero-heart">♥</div>
      <div class="scroll-hint">
        <div class="scroll-line"></div>
        <span>scroll</span>
      </div>
    </section>

    <!-- COUNTER -->
    <section id="counter-section">
      <p class="section-label">When we fell</p>
      <div class="counter-grid">
        <div class="counter-item">
          <span class="counter-num" id="c-years">0</span
          ><span class="counter-label">Years</span>
        </div>
        <div class="counter-item">
          <span class="counter-num" id="c-months">0</span
          ><span class="counter-label">Months</span>
        </div>
        <div class="counter-item">
          <span class="counter-num" id="c-days">0</span
          ><span class="counter-label">Days</span>
        </div>
        <div class="counter-item">
          <span class="counter-num" id="c-hours">0</span
          ><span class="counter-label">Hours</span>
        </div>
      </div>
      <p class="counter-since">since March 14, 2025 ♥</p>
    </section>

    <!-- LETTER -->
    <section id="letter-section">
      <div class="letter-header">
        <h2 class="letter-title">A letter I wrote<br /><em>for you</em></h2>
      </div>

      <div class="letter-wrap">
        <div class="letter-paper">
          <div class="letter-date" id="letter-date"></div>
          <div class="letter-salutation" id="letter-sal">Hey,</div>
          <div class="letter-body">
            <span id="typed-text"></span
            ><span class="type-cursor" id="type-cursor"></span>
          </div>
          <div class="letter-sign" id="letter-sign">
            -Sasant,<br />
            ♥
          </div>
          <div class="letter-stamp">♥</div>
        </div>
      </div>
    </section>

    <!-- FINALE -->
    <section id="finale">
      <p class="finale-text">I love you<br /><em>more than code.</em></p>
      <p class="finale-from">— always yours</p>
    </section>

    <script>
      // ---- Cursor ----
      const cursor = document.getElementById("cursor");
      const ring = document.getElementById("cursorRing");
      let mx = 0,
        my = 0,
        rx = 0,
        ry = 0;
      document.addEventListener("mousemove", (e) => {
        mx = e.clientX;
        my = e.clientY;
        cursor.style.left = mx + "px";
        cursor.style.top = my + "px";
      });
      (function animRing() {
        rx += (mx - rx) * 0.12;
        ry += (my - ry) * 0.12;
        ring.style.left = rx + "px";
        ring.style.top = ry + "px";
        requestAnimationFrame(animRing);
      })();

      // ---- Particles ----
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      let W,
        H,
        parts = [];
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
      function mkPart() {
        return {
          x: Math.random() * W,
          y: H + 20,
          sz: Math.random() * 12 + 5,
          vy: Math.random() * 0.5 + 0.25,
          vx: (Math.random() - 0.5) * 0.35,
          op: Math.random() * 0.35 + 0.08,
          rot: Math.random() * Math.PI * 2,
          rv: (Math.random() - 0.5) * 0.018,
        };
      }
      for (let i = 0; i < 28; i++) {
        const p = mkPart();
        p.y = Math.random() * H;
        parts.push(p);
      }
      function drawHeart(x, y, s, rot, op) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.globalAlpha = op;
        ctx.fillStyle = "#c8445a";
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.3);
        ctx.bezierCurveTo(s * 0.5, -s, s, -s * 0.3, 0, s * 0.5);
        ctx.bezierCurveTo(-s, -s * 0.3, -s * 0.5, -s, 0, -s * 0.3);
        ctx.fill();
        ctx.restore();
      }
      function animParts() {
        ctx.clearRect(0, 0, W, H);
        parts.forEach((p, i) => {
          p.y -= p.vy;
          p.x += p.vx;
          p.rot += p.rv;
          if (p.y < -20) parts[i] = mkPart();
          drawHeart(p.x, p.y, p.sz, p.rot, p.op);
        });
        requestAnimationFrame(animParts);
      }
      animParts();

      // ---- Counter ----
      function updateCounter() {
        const start = new Date("2025-03-14T00:00:00"),
          now = new Date(),
          diff = now - start;
        const totalH = Math.floor(diff / 3600000);
        const totalD = Math.floor(totalH / 24);
        const y = Math.floor(totalD / 365.25);
        const m = Math.floor((totalD % 365.25) / 30.44);
        const d = Math.floor(totalD % 30.44);
        const h = totalH % 24;
        document.getElementById("c-years").textContent = y;
        document.getElementById("c-months").textContent = m;
        document.getElementById("c-days").textContent = d;
        document.getElementById("c-hours").textContent = h;
      }
      updateCounter();
      setInterval(updateCounter, 1000);

      // ---- Letter date ----
      const now = new Date();
      document.getElementById("letter-date").textContent =
        now.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });

      // ---- Typewriter ----
      const letterLines = [
        "Do you remember the first time we met?",
        "",

        "I do. I didn't know it then,",
        "but that day quietly changed everything for me.",
        "When I shaw you,",
        "from the floor above",
        "I couldnt believe in my heart",
        "You were looking gorgeous and cute as hell.",
        "",

        "As of our first meetup",
        "I cant forget that day.",
        "I was ready if you don't arrive,",
        "I'll leave the bouquet there and go.",
        "I was so ready for it ",
        "But you showed up,",
        "Fuck Me! I was in delusion on what to do next",
        "You shaw the flowers, So I have to give it to you",
        "I couldnt speak as of nervousness,",
        "But thank the shit you didn't create a situation,",
        "And I knew that day you were something.",
        "",

        "I love you",
        "Because of the small things you do,",
        "without being asked, without expecting anything,",
        "Every ordinary moment",
        "you make it feels like it has to do something with me",
        "like something you have been calculating ahead",
        "",

        "I love you because you chose me.",
        "And you keep choosing me.",
        "I dont know why, Is it because you are that kind",
        " or I am that special to you",
        "",

        "Every morning call you make,",
        "Everyday you make me listen your voice",
        "At every damn begaining of the day",
        "With you soft voice ringing right before sunrise,",
        "Is what I crave before bed",
        "",

        "You want to be one of my habits dont you?",
        "And Yes you already are one of my worst habit.",
        "",

        "I'll foreever be loving you as always.",
      ];

      let started = false;
      const typedEl = document.getElementById("typed-text");
      const typeCursor = document.getElementById("type-cursor");

      // Typing sound using Web Audio API
      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playClick() {
        try {
          const ac = getAudioCtx();
          const buf = ac.createBuffer(1, ac.sampleRate * 0.04, ac.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            data[i] =
              (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.008));
          }
          const src = ac.createBufferSource();
          src.buffer = buf;
          const gain = ac.createGain();
          gain.gain.value = 0.06;
          src.connect(gain);
          gain.connect(ac.destination);
          src.start();
        } catch (e) {}
      }

      function typeWriter(lines, el) {
        let lineIdx = 0,
          charIdx = 0;
        let html = "";

        function typeNext() {
          if (lineIdx >= lines.length) {
            typeCursor.style.display = "none";
            gsap.to("#letter-sign", {
              opacity: 1,
              y: 0,
              duration: 0.8,
              ease: "power3.out",
            });
            return;
          }

          const line = lines[lineIdx];

          if (charIdx < line.length) {
            const ch = line[charIdx];
            if (ch === " ") {
              html += "&nbsp;";
            } else {
              html += ch;
              playClick();
            }
            el.innerHTML = html;
            charIdx++;
            const delay =
              line[charIdx - 1] === "," || line[charIdx - 1] === "."
                ? 180
                : Math.random() * 55 + 35;
            setTimeout(typeNext, delay);
          } else {
            html += "<br>";
            if (lines[lineIdx] === "") html += "<br>";
            el.innerHTML = html;
            lineIdx++;
            charIdx = 0;
            setTimeout(typeNext, lines[lineIdx - 1] === "" ? 80 : 220);
          }
        }

        typeNext();
      }

      // ---- GSAP ----
      gsap.registerPlugin(ScrollTrigger);
      gsap.set([".hero-eyebrow", ".hero-name", ".hero-sub", ".hero-heart"], {
        y: 28,
      });

      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
      tl.to(".hero-eyebrow", { opacity: 1, y: 0, duration: 1, delay: 0.4 })
        .to(".hero-name", { opacity: 1, y: 0, duration: 1.2 }, "-=0.5")
        .to(".hero-sub", { opacity: 1, y: 0, duration: 1 }, "-=0.6")
        .to(".hero-heart", { opacity: 1, duration: 0.8 }, "-=0.4")
        .to(".scroll-hint", { opacity: 1, duration: 1 }, "-=0.2");

      // Counter entrance
      gsap.from(".counter-num", {
        textContent: 0,
        duration: 2,
        ease: "power2.out",
        snap: { textContent: 1 },
        scrollTrigger: { trigger: "#counter-section", start: "top 70%" },
      });

      // Letter paper entrance
      gsap.from(".letter-paper", {
        opacity: 0,
        y: 50,
        duration: 1.2,
        ease: "power3.out",
        scrollTrigger: { trigger: "#letter-section", start: "top 65%" },
      });

      gsap.set(["#letter-date", "#letter-sal", "#letter-sign"], { y: 10 });

      ScrollTrigger.create({
        trigger: "#letter-section",
        start: "top 55%",
        once: true,
        onEnter: () => {
          if (started) return;
          started = true;
          gsap.to("#letter-date", {
            opacity: 1,
            y: 0,
            duration: 0.6,
            delay: 0.4,
          });
          gsap.to("#letter-sal", {
            opacity: 1,
            y: 0,
            duration: 0.6,
            delay: 0.9,
          });
          setTimeout(() => typeWriter(letterLines, typedEl), 1400);
        },
      });

      // Finale
      gsap.from(".finale-text", {
        opacity: 0,
        y: 50,
        duration: 1.2,
        ease: "power3.out",
        scrollTrigger: { trigger: "#finale", start: "top 70%" },
      });
      gsap.from(".finale-from", {
        opacity: 0,
        duration: 1,
        delay: 0.5,
        scrollTrigger: { trigger: "#finale", start: "top 70%" },
      });
    </script>
  </body>
</html>
